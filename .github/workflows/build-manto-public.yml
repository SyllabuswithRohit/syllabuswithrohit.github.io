name: Build Manto Classics

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - automation/classics/manto_builder.py
      - automation/classics/premchand_novels_builder.py
      - .github/workflows/build-manto-public.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: manto-classics-builder
  cancel-in-progress: true

jobs:
  build-eight-stories:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Manto automation branch
        uses: actions/checkout@v4
        with:
          ref: automation/manto-classics-builder
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Build all eight complete first passes
        shell: bash
        run: |
          set +e
          mkdir -p automation/classics generated
          python automation/classics/manto_builder.py > automation/classics/manto-build.log 2>&1
          code=$?
          echo "$code" > automation/classics/manto-build.exit
          cat automation/classics/manto-build.log
          exit 0

      - name: Commit generated stories and diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name 'SyllabuswithRohit editorial bot'
          git config user.email '274160084+SyllabuswithRohit@users.noreply.github.com'
          git add -- generated/works/manto generated/MANTO_QA.md generated/manto-manifest-fragment.json automation/classics/manto-build.log automation/classics/manto-build.exit
          if [ -f generated/MANTO_BUILD_FAILURE.txt ]; then
            git add -- generated/MANTO_BUILD_FAILURE.txt
          fi
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'content: generate all eight Manto first passes'
            git pull --rebase origin automation/manto-classics-builder
            git push origin HEAD:automation/manto-classics-builder
          fi

      - name: Upload generated Manto bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manto-eight-stories-roman-hindustani
          path: |
            generated/works/manto
            generated/MANTO_QA.md
            generated/manto-manifest-fragment.json
            generated/MANTO_BUILD_FAILURE.txt
            automation/classics/manto-build.log
            automation/classics/manto-build.exit
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce build result
        if: always()
        shell: bash
        run: |
          code=$(cat automation/classics/manto-build.exit 2>/dev/null || echo 1)
          if [ "$code" -ne 0 ]; then
            echo "Manto builder exited with code $code"
            exit "$code"
          fi
