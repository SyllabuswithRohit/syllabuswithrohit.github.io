name: Test Classics Transliteration

on:
  push:
    branches:
      - automation/classics-builder
    paths:
      - automation/test_transliteration.py
      - .github/workflows/test-classics-transliteration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/classics-builder
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check aksharamukha
      - run: python automation/test_transliteration.py
      - name: Commit samples
        run: |
          git config user.name 'SyllabuswithRohit editorial bot'
          git config user.email '274160084+SyllabuswithRohit@users.noreply.github.com'
          git add generated/logs/translit-samples.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record transliteration engine samples'
            git pull --rebase origin automation/classics-builder
            git push origin HEAD:automation/classics-builder
          fi
