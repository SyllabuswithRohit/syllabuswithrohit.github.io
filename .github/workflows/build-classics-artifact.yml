name: Build Classics Artifact

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - tools/classics_builder.py
      - .github/workflows/build-classics-artifact.yml
  issues:
    types:
      - opened
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: >-
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[run-classics-artifact]')) ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'automation/classics-artifact-20260823')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/classics-artifact-20260823
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install text tools
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 indic-transliteration

      - name: Normalize rare Devanagari source variants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/classics_builder.py')
          s = p.read_text(encoding='utf-8')
          old = '.replace("़","")'
          new = '.replace("़","").replace("ऩ","न").replace("ऱ","र").replace("ऴ","ल").replace("क़","क").replace("ख़","ख").replace("ग़","ग").replace("ज़","ज").replace("ड़","ड").replace("ढ़","ढ").replace("फ़","फ").replace("य़","य")'
          if old not in s:
              raise SystemExit('normalization target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run complete long-work build and capture outcome
        id: build
        shell: bash
        run: |
          set +e
          python tools/classics_builder.py > /tmp/classics-build.log 2>&1
          code=$?
          cat /tmp/classics-build.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist generated corpus, log and status on temporary branch
        shell: bash
        run: |
          mkdir -p .github/workflow-status
          cp /tmp/classics-build.log .github/workflow-status/classics-build.log 2>/dev/null || echo 'Build log missing.' > .github/workflow-status/classics-build.log
          {
            echo "exit_code=${{ steps.build.outputs.exit_code }}"
            echo "source_commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_ID}"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .github/workflow-status/classics-build.status

          git config user.name 'SWR temporary classics builder'
          git config user.email '274160084+SyllabuswithRohit@users.noreply.github.com'
          git add -- generated .github/workflow-status/classics-build.log .github/workflow-status/classics-build.status
          if git diff --cached --quiet; then
            echo 'No generated or status changes to commit.'
          else
            git commit -m 'chore: record classics artifact build outcome'
            git pull --rebase origin automation/classics-artifact-20260823
            git push origin HEAD:automation/classics-artifact-20260823
          fi

      - name: Upload generated corpus when present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classics-generated-20260823
          path: generated
          if-no-files-found: warn
          retention-days: 7
