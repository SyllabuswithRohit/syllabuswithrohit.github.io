name: Build Classics Artifact

on:
  push:
    branches:
      - automation/classics-artifact-20260823
    paths:
      - tools/classics_builder.py
      - .github/workflows/build-classics-artifact.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/classics_builder.py
      - .github/workflows/build-classics-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install text tools
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 indic-transliteration
      - name: Build complete first-pass files
        run: python tools/classics_builder.py
      - name: Upload generated corpus
        uses: actions/upload-artifact@v4
        with:
          name: classics-generated-20260823
          path: generated
          if-no-files-found: error
          retention-days: 1
