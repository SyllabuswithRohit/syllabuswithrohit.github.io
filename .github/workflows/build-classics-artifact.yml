name: Build Classics Artifact

on:
  push:
    branches:
      - automation/classics-builder
    paths:
      - automation/build_all_classics.py
      - automation/run_builder.py
      - automation/diagnose_rekhta.py
      - .github/workflows/build-classics-artifact.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - automation/build_all_classics.py
      - automation/run_builder.py
      - automation/diagnose_rekhta.py
      - .github/workflows/build-classics-artifact.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'automation/classics-builder'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out builder branch
        uses: actions/checkout@v4
        with:
          ref: automation/classics-builder
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml indic-transliteration

      - name: Diagnose Rekhta page data
        continue-on-error: true
        run: python automation/diagnose_rekhta.py

      - name: Build all remaining classics
        id: build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p generated/logs
          set +e
          python automation/run_builder.py > generated/logs/build.log 2>&1
          code=$?
          echo "$code" > generated/logs/exit-code.txt
          cat generated/logs/build.log
          exit "$code"

      - name: Commit generated files and logs
        if: always()
        shell: bash
        run: |
          git config user.name 'SyllabuswithRohit editorial bot'
          git config user.email '274160084+SyllabuswithRohit@users.noreply.github.com'
          git add -- generated
          if ! git diff --cached --quiet; then
            git commit -m 'content: generate complete classics first passes and diagnostics'
            git pull --rebase origin automation/classics-builder
            git push origin HEAD:automation/classics-builder
          fi

      - name: Package generated tree
        if: always()
        run: tar -czf classics-generated.tar.gz generated

      - name: Upload generated artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classics-generated
          path: classics-generated.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Fail when builder failed
        if: always()
        shell: bash
        run: |
          code=$(cat generated/logs/exit-code.txt 2>/dev/null || echo 1)
          test "$code" = "0"
