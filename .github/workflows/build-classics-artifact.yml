name: Build Classics Artifact

on:
  push:
    branches:
      - automation/classics-artifact-20260823
    paths:
      - tools/classics_builder.py
      - .github/workflows/build-classics-artifact.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - tools/classics_builder.py
      - .github/workflows/build-classics-artifact.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/classics-artifact-20260823
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install text tools
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 indic-transliteration

      - name: Build complete long-work first passes
        run: python tools/classics_builder.py

      - name: Validate and upload generated corpus
        uses: actions/upload-artifact@v4
        with:
          name: classics-generated-20260823
          path: generated
          if-no-files-found: error
          retention-days: 7

      - name: Persist generated corpus on temporary branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'SWR temporary classics builder'
          git config user.email '274160084+SyllabuswithRohit@users.noreply.github.com'
          git add -- generated
          git commit -m 'chore: persist temporary classics build artifact'
          git pull --rebase origin automation/classics-artifact-20260823
          git push origin HEAD:automation/classics-artifact-20260823
