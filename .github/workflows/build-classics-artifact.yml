name: Build Classics Artifact

on:
  push:
    branches: [automation/classics-builder]
    paths:
      - automation/build_all_classics.py
      - automation/run_builder.py
      - automation/run_builder_ai4bharat.py
      - automation/rebuild_premchand_quality.py
      - .github/workflows/build-classics-artifact.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - automation/build_all_classics.py
      - automation/run_builder.py
      - automation/run_builder_ai4bharat.py
      - automation/rebuild_premchand_quality.py
      - .github/workflows/build-classics-artifact.yml
  workflow_dispatch:

concurrency:
  group: classics-builder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'automation/classics-builder'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/classics-builder
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install core dependencies
        run: |
          python -m pip install --disable-pip-version-check 'pip<24.1'
          python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml indic-transliteration aksharamukha 'numpy==1.24.3'
      - name: Install AI4Bharat Urdu transliterator
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.0.1'
          python -m pip install --disable-pip-version-check 'ai4bharat-transliteration==1.1.3'
      - name: Build complete remaining classics
        id: build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p generated/logs
          set +e
          python automation/run_builder_ai4bharat.py > generated/logs/build.log 2>&1
          code=$?
          echo "$code" > generated/logs/exit-code.txt
          cat generated/logs/build.log
          exit "$code"
      - name: Rebuild Premchand novels in natural Roman Hindustani
        id: novels
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python automation/rebuild_premchand_quality.py > generated/logs/premchand-quality-build.log 2>&1
          code=$?
          echo "$code" > generated/logs/premchand-quality-exit-code.txt
          cat generated/logs/premchand-quality-build.log
          exit "$code"
      - name: Commit generated files and logs
        if: always()
        shell: bash
        run: |
          git config user.name 'SyllabuswithRohit editorial bot'
          git config user.email '274160084+SyllabuswithRohit@users.noreply.github.com'
          git add -- generated
          if ! git diff --cached --quiet; then
            git commit -m 'content: generate all remaining readable classics first passes'
            git pull --rebase origin automation/classics-builder
            git push origin HEAD:automation/classics-builder
          fi
      - name: Package generated tree
        if: always()
        run: tar -czf classics-generated.tar.gz generated
      - name: Upload generated artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classics-generated
          path: classics-generated.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Fail when required stages failed
        if: always()
        shell: bash
        run: |
          main=$(cat generated/logs/exit-code.txt 2>/dev/null || echo 1)
          novels=$(cat generated/logs/premchand-quality-exit-code.txt 2>/dev/null || echo 1)
          test "$main" = "0" -a "$novels" = "0"
