name: Build Premchand Reader Batch 2

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - automation/build_premchand_batch2.py
      - automation/run_premchand_batch2.py
      - .github/workflows/build-premchand-batch2.yml
  workflow_dispatch:

concurrency:
  group: premchand-reader-batch-2
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'book-collection-long-works'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out collection companion branch
        uses: actions/checkout@v4
        with:
          ref: book-collection-long-works
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install text-processing dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          requests indic-transliteration

      - name: Build twenty complete reader first passes
        shell: bash
        run: |
          mkdir -p generated
          set -o pipefail
          python automation/run_premchand_batch2.py 2>&1 | tee generated/premchand-batch2-build.log

      - name: Commit generated readers
        shell: bash
        run: |
          git config user.name 'SyllabuswithRohit editorial bot'
          git config user.email '274160084+SyllabuswithRohit@users.noreply.github.com'
          git add -- generated/works/premchand generated/PREMCHAND_BATCH_2.md generated/premchand-batch2-qa.json generated/premchand-batch2-build.log
          if ! git diff --cached --quiet; then
            git commit -m 'content: add 20 complete Premchand reader first passes'
            git pull --rebase origin book-collection-long-works
            git push origin HEAD:book-collection-long-works
          fi

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premchand-reader-batch-2
          path: |
            generated/PREMCHAND_BATCH_2.md
            generated/premchand-batch2-qa.json
            generated/premchand-batch2-build.log
          if-no-files-found: warn
          retention-days: 14
