name: Build Urdu-e-Mualla Artifact

on:
  push:
    branches:
      - automation/roman-classics-long-builder
    paths:
      - automation/build_urdu_e_mualla.py
      - .github/workflows/build-urdu-e-mualla.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - automation/build_urdu_e_mualla.py
      - .github/workflows/build-urdu-e-mualla.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'automation/roman-classics-long-builder'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/roman-classics-long-builder
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Build Ghalib letters
        run: python automation/build_urdu_e_mualla.py | tee generated/urdu-e-mualla-build.log
      - name: Commit generated work
        run: |
          git config user.name 'SyllabuswithRohit editorial bot'
          git config user.email '274160084+SyllabuswithRohit@users.noreply.github.com'
          git add -- generated
          if ! git diff --cached --quiet; then
            git commit -m 'content: build Urdu-e-Mualla Roman first pass'
            git pull --rebase origin automation/roman-classics-long-builder
            git push origin HEAD:automation/roman-classics-long-builder
          fi
      - name: Package artifact
        run: tar -czf urdu-e-mualla-generated.tar.gz generated/works/ghalib/urdu-e-mualla generated/urdu-e-mualla-build.json generated/urdu-e-mualla-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: urdu-e-mualla-generated
          path: urdu-e-mualla-generated.tar.gz
          if-no-files-found: error
          retention-days: 14
