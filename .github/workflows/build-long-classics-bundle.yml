name: Build Long Classics Bundle

on:
  push:
    branches:
      - automation/long-classics-bundle-20260823
    paths:
      - tools/long_bundle_builder.py
      - .github/workflows/build-long-classics-bundle.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - tools/long_bundle_builder.py
      - .github/workflows/build-long-classics-bundle.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/long-classics-bundle-20260823
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 indic-transliteration
      - name: Normalize rare Devanagari variants
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/long_bundle_builder.py')
          s = p.read_text(encoding='utf-8')
          old = '.replace("ऑ","ओ").replace("ॉ","ो").replace("ऍ","ए").replace("ॅ","े").replace("़","")'
          new = old + '.replace("ऩ","न").replace("ऱ","र").replace("ऴ","ळ")'
          if old not in s:
              raise SystemExit('normalization target not found')
          s = s.replace(old, new)
          old_line = 'out = transliterate(text,sanscript.DEVANAGARI,sanscript.ITRANS)'
          new_line = old_line + '\n    out = out.translate(str.maketrans({"ऩ":"n","ऱ":"r","ऴ":"l","ॉ":"o","ॅ":"e","़":""}))'
          if old_line not in s:
              raise SystemExit('post-transliteration cleanup target not found')
          p.write_text(s.replace(old_line, new_line), encoding='utf-8')
          PY
      - name: Build complete long-work bundle
        run: python tools/long_bundle_builder.py
      - name: Upload generated bundle
        uses: actions/upload-artifact@v4
        with:
          name: long-classics-bundle-20260823
          path: generated_bundle
          if-no-files-found: error
          retention-days: 2
      - name: Persist generated bundle on temporary branch
        run: |
          set -euo pipefail
          git config user.name 'SWR long classics builder'
          git config user.email '274160084+SyllabuswithRohit@users.noreply.github.com'
          git add -- generated_bundle
          git commit -m 'chore: persist long classics bundle'
          git pull --rebase origin automation/long-classics-bundle-20260823
          git push origin HEAD:automation/long-classics-bundle-20260823
